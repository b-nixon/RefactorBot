<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RefactorBot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-left">
      <span class="logo">⇄</span>
      <span class="title">diff<span class="title-accent">view</span></span>
    </div>
    <div class="header-right">
      <label class="toggle-label">
        <input type="checkbox" id="inlineToggle" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-text">Inline</span>
      </label>
    </div>
  </header>

  <!-- Upload Bar -->
  <div class="upload-bar">
    <div class="upload-slot" id="slotOriginal">
      <input type="file" id="fileOriginal" accept=".js,.py,.java,.cpp,.cs,.rs" />
      <button class="upload-btn" onclick="document.getElementById('fileOriginal').click()">
        <span class="upload-icon">↑</span>
        <span id="labelOriginal">Upload Original</span>
      </button>
      <span class="file-badge" id="badgeOriginal"></span>
    </div>

    <div class="upload-divider">vs</div>

    <div class="upload-slot" id="slotModified">
      <input type="file" id="fileModified" accept=".js,.py,.java,.cpp,.cs,.rs" />
      <button class="upload-btn" onclick="document.getElementById('fileModified').click()">
        <span class="upload-icon">↑</span>
        <span id="labelModified">Upload Modified</span>
      </button>
      <span class="file-badge" id="badgeModified"></span>
    </div>

    <button class="clear-btn" onclick="clearAll()" title="Clear both files">✕ Clear</button>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    <span class="status-hint">Upload two files to compare them</span>
  </div>

  <!-- Editor Container -->
<div id="editorContainer">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">⇄</div>
    <div class="empty-title">No files loaded</div>
    <div class="empty-sub">
    </div>
  </div>

  <div id="workspace">
    <div id="editableEditor"></div>
    <div id="diffViewer"></div>
  </div>
</div>

  <!-- Monaco from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
