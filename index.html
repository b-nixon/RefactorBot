<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>refactorBot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <span class="title">refactorBot</span>
    </div>
    <div class="header-right">
      <label class="toggle-label">
        <input type="checkbox" id="inlineToggle" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-text">Inline</span>
      </label>
    </div>
  </header>

  <div class="upload-bar">
    <div class="upload-slot" id="slotOriginal">
      <input type="file" id="fileOriginal" accept=".js,.py,.java,.cpp,.cs,.rs" />
      <button class="upload-btn" onclick="document.getElementById('fileOriginal').click()">
        <span class="upload-icon">↑</span>
        <span id="labelOriginal">Upload Original</span>
      </button>
      <span class="file-badge" id="badgeOriginal"></span>
    </div>

    <button class="clear-btn" onclick="clearAll()" title="Clear all">Clear</button>
    <button class="refactor-btn" onclick="refactorCode()" title="Refactor code using AI">Refactor</button>
  </div>

  <div id="explanationPanel" class="explanation-panel">
    <div class="explanationHeader">Refactor Explanation</div>
    <div id="explanationContent">Click "Refactor" to see AI explanation.
    </div>
  </div>

<div id="editorContainer">
  <div id="workspace">
    <div class="editor-pane">
      <div class="pane-header">
        Original Code
      </div>
      <div id="editableEditor"></div>
    </div>
    <div class="editor-pane">
      <div class="pane-header">
        Refactored Diff
      </div>
      <div id="diffViewer"></div>
    </div>
  </div>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script src="test.js"></script>
</body>
</html>
